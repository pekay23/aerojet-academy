name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/aerojet

      - name: Type check
        run: bun run type-check
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/aerojet

      - name: Check encoding
        run: bun run scripts/check-encoding.mjs

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: bun run test --run
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/aerojet
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: ci-cron-secret
          RESEND_API_KEY: re_ci_placeholder
          UPLOADTHING_SECRET: sk_ci_placeholder
          UPLOADTHING_APP_ID: ci_placeholder
          GOOGLE_CLIENT_ID: ci_placeholder
          GOOGLE_CLIENT_SECRET: ci_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_placeholder

  build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-cache-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-cache-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-${{ hashFiles('app/**', 'lib/**', 'components/**', 'hooks/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Build
        run: bun run build
        env:
          # Raise Node's heap ceiling for this CI runner only — ubuntu-latest caps
          # the default heap at ~2GB and doesn't auto-size, OOMing next build's TS
          # phase. Vercel sizes its own heap, so this is intentionally NOT in the
          # build script (kept CI-machine-specific).
          NODE_OPTIONS: --max_old_space_size=4096
          # Required by lib/env.ts Zod schema at runtime (partial parse at build time)
          DATABASE_URL: postgresql://postgres:password@localhost:5432/aerojet
          NEXTAUTH_SECRET: ci-test-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          CRON_SECRET: ci-cron-secret
          RESEND_API_KEY: re_ci_placeholder
          UPLOADTHING_SECRET: sk_ci_placeholder
          UPLOADTHING_APP_ID: ci_placeholder
          GOOGLE_CLIENT_ID: ci_placeholder
          GOOGLE_CLIENT_SECRET: ci_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_placeholder
