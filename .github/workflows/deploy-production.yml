name: Pre-Deploy Validation

# Note: Production deployment is handled by Vercel's Git integration
# (auto-deploys on push to main). This workflow only runs validation
# checks to gate the Vercel deployment.

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Run tests
        run: bun run test --run

      - name: Run DB migrations (before deploy)
        run: |
          export DATABASE_URL="${{ secrets.PRODUCTION_DATABASE_URL }}"
          export DIRECT_URL="${DATABASE_URL/-pooler/}"
          cat << 'EOF' > clear-lock.js
          const { Client } = require('pg')
          async function main() {
            const client = new Client({ connectionString: process.env.DIRECT_URL })
            await client.connect()
            const res = await client.query(`
              SELECT pg_terminate_backend(pid)
              FROM pg_stat_activity
              WHERE datname = current_database() AND pid <> pg_backend_pid()
            `)
            console.log("Terminated backends:", res.rows)
            await client.end()
          }
          main().catch(console.error)
          EOF
          bun run clear-lock.js
          bunx prisma migrate deploy

      - name: Build check
        run: bun run build
