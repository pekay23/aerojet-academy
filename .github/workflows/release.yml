name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Read version and determine tag prefix
        id: release
        run: |
          BRANCH="${{ github.ref_name }}"
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG_PREFIX="${BRANCH}/"
          TAG="${TAG_PREFIX}v${VERSION}"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Creating $TAG for $BRANCH"

      - name: Create and push tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git ls-remote --exit-code --refs origin "refs/tags/$TAG" >/dev/null 2>&1; then
            EXISTING_COMMIT="$(git ls-remote origin "refs/tags/$TAG^{}" | awk '{print $1}')"

            if [ "$EXISTING_COMMIT" = "$COMMIT" ]; then
              echo "Tag $TAG already points to $COMMIT; nothing to do."
              exit 0
            fi

            echo "::error::Tag $TAG already exists at $EXISTING_COMMIT, but this release is $COMMIT."
            exit 1
          fi

          git tag "$TAG" "$COMMIT"
          git push origin "refs/tags/$TAG"
